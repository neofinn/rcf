<html lang="en">
<head>
<script>
(() => {
  window.RC_DEMO = true;
  window.RC_STANDALONE = true;
  const PAGES = { '/': 'order.html', '/index.html': 'order.html', '/track.html': 'track.html', '/outlet/': 'outlet.html', '/admin/': 'admin.html', '/whatsapp-sim.html': 'whatsapp.html' };
  const pageUrl = (u) => { const x = new URL(u, 'https://demo.local'); return (PAGES[x.pathname] || x.pathname.slice(1)) + x.search; };
  window.RC_NAVIGATE = (u) => { location.href = pageUrl(u); };
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="/"]');
    if (a) { e.preventDefault(); location.href = pageUrl(a.getAttribute('href')); }
  }, true);

  let send;
  const ready = new Promise((resolve) => {
    if (window.SharedWorker) {
      try {
        const pending = new Map();
        let seq = 0;
        const w = new SharedWorker('demo-worker.js', { name: 'raju-chinese-demo' });
        w.port.onmessage = (e) => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); p(e.data); } };
        w.port.start();
        send = (msg) => new Promise((r) => { const id = ++seq; pending.set(id, r); w.port.postMessage({ ...msg, id }); });
        return resolve();
      } catch (e) { /* fall back below */ }
    }
    // No SharedWorker (e.g. Chrome on Android): this tab runs the demo backend
    // itself; it is still saved in the browser, so other pages pick it up.
    const load = (src) => new Promise((r) => { const s = document.createElement('script'); s.src = src; s.onload = r; document.head.appendChild(s); });
    load('demo-backend.js').then(() => load('demo-server.js')).then(() => {
      send = (m) => RCDemoServer.handle(m);
      resolve();
    });
  });
  // ?reset starts the demo again from scratch.
  if (new URLSearchParams(location.search).has('reset')) {
    ready.then(() => send({ kind: 'reset' })).then(() => {
      try { for (const k of Object.keys(localStorage)) if (/^(rc\.|rca\.|rco\.|sim\.)/.test(k)) localStorage.removeItem(k); } catch (e) { /* storage blocked */ }
      location.replace(location.pathname);
    });
  }

  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opts = {}) => {
    const u = String(url);
    if (!/^\/(api|webhooks)\//.test(u)) return realFetch(url, opts);
    await ready;
    const auth = (opts.headers && (opts.headers.Authorization || opts.headers.authorization)) || '';
    const r = await send({ method: (opts.method || 'GET').toUpperCase(), url: u, body: opts.body ? JSON.parse(opts.body) : null, token: auth.replace(/^Bearer\s+/i, '') });
    const text = typeof r.body === 'string' ? r.body : JSON.stringify(r.body);
    return new Response(text, { status: r.status, headers: { 'Content-Type': 'application/json' } });
  };
})();
</script>

.menu-table tr.off td { opacity: 0.55; }
.menu-table input.saved { outline: 2px solid var(--ok); }
table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; }
td, th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.chat { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.bubbles { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
.b { padding: 6px 10px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; font-size: 0.9rem; overflow-wrap: anywhere; }
.b.in { background: var(--bg); align-self: flex-start; }
.b.out { background: #d9fdd3; color: #111; align-self: flex-end; }
.b.bot { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 0.8rem; align-self: stretch; max-width: none; }
.chat form { display: flex; gap: 6px; }
.chat form input { flex: 1; }
.chat form button { width: auto; flex: none; }
#chatCount:not(:empty) { background: var(--accent); color: #111; border-radius: 999px; padding: 0 6px; font-size: 0.75rem; }
.delivery { padding: 6px 8px; border-radius: 8px; background: var(--bg); }
.delivery.bad { color: var(--nonveg); background: rgba(179, 38, 30, 0.08); }
.chip.pay-pending, .chip.pay-claimed { background: rgba(244, 163, 0, 0.18); border-color: var(--accent); }
.chip.pay-paid { background: rgba(26, 138, 58, 0.15); border-color: var(--ok); color: var(--ok); }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }

/* Head office stock screen */
.stock-table td { vertical-align: top; }
.stock-cell { min-width: 112px; }
.stock-cell label { display: flex; gap: 6px; align-items: center; font-size: 0.85rem; font-weight: 600; }
.stock-cell input[type=number] { margin-top: 4px; padding: 5px 8px; max-width: 96px; font-size: 0.85rem; }
.stock-cell.off { background: var(--bg); }
.stock-cell.off label { color: var(--muted); }
.stock-cell.out input[type=number], .stock-cell.low input[type=number] { border-color: var(--accent); background: rgba(244, 163, 0, 0.12); }
.stock-all { white-space: nowrap; }
.stock-all .chip { cursor: pointer; }

/* Add / edit outlet */
.outlet-form { display: grid; gap: 10px; max-width: 640px; }
.outlet-form .row > * { flex: 1; }
.ofield { display: grid; gap: 4px; font-weight: 600; font-size: 0.88rem; }
.ofield small { font-weight: 400; }

/* Head office → Connections */
.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.conn-grid .card { margin-bottom: 0; }
.conn-fields { display: grid; gap: 8px; }
.conn .ofield span .src { font-weight: 400; color: var(--muted); font-size: 0.8rem; margin-left: 4px; }
.conn .webhook { margin: 0 0 10px; overflow-wrap: anywhere; }
.conn .webhook code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.chip.conn-ok { background: rgba(26, 138, 58, 0.15); border-color: var(--ok); color: var(--ok); }
.chip.conn-test { background: rgba(244, 163, 0, 0.18); border-color: var(--accent); }
.chip.conn-warn { background: rgba(179, 38, 30, 0.12); border-color: var(--nonveg); color: var(--nonveg); }
.conn-msg.good { color: var(--ok); }
.conn-msg.bad, p.bad { color: var(--nonveg); }
.conn-log { margin: 0; padding-left: 18px; }
@media (max-width: 400px) { .conn-grid { grid-template-columns: minmax(0, 1fr); } }
</style>

</head>
<body data-panel="admin">
  <header class="topbar">
    <div class="logo">Raju <span>Chinese</span> · Head office</div>
    <button class="loc-chip" id="logout" type="button" style="max-width:none"><b>Log out</b></button>
  </header>

  <main class="wrap">
    <section id="login" class="track-card hidden" style="max-width:420px;margin:40px auto">
      <h3>Head office login</h3>
      <p class="small muted">Outlet staff use the outlet panel at <a href="/outlet/">/outlet/</a> instead.</p>
      <form id="loginForm">
        <label for="token">Admin token</label>
        <input id="token" type="password" autocomplete="current-password" required>
        <p class="error hidden" id="loginError"></p>
        <button class="btn" style="margin-top:12px">Log in</button>
      </form>
    </section>

    <section id="dash" class="hidden">
      <div class="bar">
        <select id="outlet"><option value="">All outlets</option></select>
        <div class="tabs" style="margin:0">
          <button type="button" data-view="live" class="on">Live orders</button>
          <button type="button" data-view="chats">Chats <span id="chatCount"></span></button>
          <button type="button" data-view="history">History</button>
          <button type="button" data-view="customers">Customers</button>
          <button type="button" data-view="menu">Menu</button>
          <button type="button" data-view="stock">Stock</button>
          <button type="button" data-view="outlets">Outlets</button>
          <button type="button" data-view="analytics">Analytics</button>
          <button type="button" data-view="connections">Connections</button>
        </div>
        <label class="vegtoggle" style="margin:0"><input type="checkbox" id="accepting" style="width:auto"> Accepting orders</label>
        <label class="vegtoggle" style="margin:0"><input type="checkbox" id="sound" style="width:auto" checked> Sound alert</label>
      </div>
      <div class="stats" id="stats"></div>
      <div id="view" style="margin-top:14px"></div>
    </section>
  </main>

  <script>'use strict';

// Staff panels. One script, two panels:
//  - head office (/admin/, data-panel="admin"): every outlet, plus Customers,
//    Menu, Stock, Outlets and Analytics (insights.js, control.js).
//  - outlet (/outlet/, data-panel="outlet"): one outlet's live orders, chats,
//    history and a read-only stock list. Logs in with the outlet's PIN.

const PANEL = document.body.dataset.panel === 'outlet' ? 'outlet' : 'admin';

const $ = (id) => document.getElementById(id);
const rupees = (p) => '₹' + (p / 100).toLocaleString('en-IN', p % 100 ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {});
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = PANEL === 'outlet' ? 'rco.' : 'rca.';
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(KEY + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch { /* ignore */ } },
};

const NEXT_LABEL = {
  accepted: 'Accept', preparing: 'Start preparing', ready: 'Mark ready', out_for_delivery: 'Out for delivery',
  completed: 'Complete', cancelled: 'Cancel',
};

const state = { token: store.get('token', '') || (window.RC_DEMO && PANEL === 'admin' ? 'demo' : ''), outletId: store.get('outlet', ''), view: 'live', outlets: [], seen: new Set(), firstLoad: true, chatSeen: new Map(), chatsLoaded: false };

async function api(path, opts = {}) {
  const res = await fetch(`/api/${PANEL}` + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) { showLogin('Session expired or wrong token.'); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function showLogin(err) {
  clearInterval(poll);
  $('dash').classList.add('hidden');
  if (PANEL === 'outlet' && window.RC_DEMO) $('pinHint').innerHTML = 'Demo: every outlet\'s PIN is <b>1234</b>. Pick the outlet your order went to (shown on the order tracking page).';
  if (PANEL === 'outlet' && !$('loginOutlet').options.length) {
    try {
      const outlets = await (await fetch('/api/outlets')).json();
      $('loginOutlet').innerHTML = outlets.map((o) => `<option value="${o.id}">${esc(o.name)}</option>`).join('');
      $('loginOutlet').value = store.get('loginOutlet', outlets[0]?.id);
    } catch { /* offline: try again on the next login */ }
  }
  $('login').classList.remove('hidden');
  $('loginError').textContent = err || '';
  $('loginError').classList.toggle('hidden', !err);
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (PANEL === 'outlet') {
    // Swap the outlet's PIN for a session token.
    const res = await fetch('/api/outlet/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ outletId: Number($('loginOutlet').value), pin: $('token').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return showLogin(data.error || 'Login failed');
    store.set('loginOutlet', $('loginOutlet').value);
    state.token = data.token;
  } else {
    state.token = $('token').value;
  }
  $('token').value = '';
  store.set('token', state.token);
  start();
});
$('logout').addEventListener('click', () => {
  if (PANEL === 'outlet' && state.token) api('/logout', { method: 'POST' }).catch(() => {});
  store.set('token', ''); state.token = ''; showLogin();
});

function beep() {
  if (!$('sound').checked) return;
  try {
    const ctx = new AudioContext();
    const o = ctx.createOscillator();
    o.frequency.value = 880;
    o.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  } catch { /* audio blocked */ }
}

const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'short', timeStyle: 'short' });
};

// Partner comparison for the order card: "Porter ₹62 ✓ · Borzo ₹70 · Shadowfax: no cash on delivery".
function quotesLine(d) {
  if (!d.quotes || d.quotes.length < 2) return '';
  const parts = d.quotes.map((q) => (q.reason
    ? `${esc(q.label)}: ${esc(q.reason)}`
    : `${q.name === d.provider ? '<b>' : ''}${esc(q.label)} ${rupees(q.price)}${q.etaMin != null ? ` (~${Math.round(q.etaMin)} min)` : ''}${q.name === d.provider ? ' ✓</b>' : ''}`));
  return `<div class="small muted">Compared: ${parts.join(' · ')}</div>`;
}

function deliveryBlock(o) {
  if (o.fulfilment !== 'delivery' || ['awaiting_payment', 'unpaid'].includes(o.status) || (['completed', 'cancelled'].includes(o.status) && !o.delivery)) return '';
  const d = o.delivery;
  const book = `<button type="button" data-delivery="${o.code}" data-action="book">🛵 ${d ? 'Try again' : 'Book rider'}</button>`;
  const own = `<button type="button" class="cancel" data-delivery="${o.code}" data-action="own">Own rider</button>`;
  if (!d) {
    if (o.status === 'placed') return '<div class="small muted" style="margin-bottom:6px">🛵 When you accept, the best available delivery partner is booked.</div>';
    return `<div class="actions" style="margin-bottom:6px">${book}${own}</div>`;
  }
  if (d.status === 'OWN') return '<div class="small" style="margin-bottom:6px">🛵 Outlet rider</div>';
  const failed = ['FAILED', 'CANCELLED', 'CANCELLED_BY_CUSTOMER', 'RETURNED_TO_SELLER', 'UNDELIVERED'].includes(d.status);
  const rider = d.rider_name ? ` · <b>${esc(d.rider_name)}</b>${d.rider_phone ? ` <a href="tel:${esc(d.rider_phone)}">${esc(d.rider_phone)}</a>` : ''}` : '';
  const collect = !failed && d.collect && d.status !== 'DELIVERED' ? ` · rider collects ${rupees(d.collect)}` : '';
  const track = d.track_url ? ` · <a href="${esc(d.track_url)}" target="_blank" rel="noopener">track</a>` : '';
  const price = d.price ? ` · ${rupees(d.price)}` : '';
  return `<div class="small delivery ${failed ? 'bad' : ''}" style="margin-bottom:6px">🛵 ${esc(d.providerLabel || d.provider)}${price} · ${esc(d.label)}${rider}${collect}${track}
    ${quotesLine(d)}
    ${d.error ? `<div>${esc(d.error)}</div>` : ''}
    ${failed ? `<div class="actions" style="margin-top:6px">${book}${own}</div>` : ''}</div>`;
}

function payActions(o) {
  if (o.payment_status === 'claimed') {
    return `<div class="actions" style="margin-bottom:6px"><button type="button" class="paid" data-pay="${o.code}" data-to="paid">✅ Payment received</button><button type="button" class="cancel" data-pay="${o.code}" data-to="pending">Not received</button></div>`;
  }
  if (o.payment_status === 'pending') {
    return `<div class="actions" style="margin-bottom:6px"><button type="button" class="paid" data-pay="${o.code}" data-to="paid">✅ Payment received</button><button type="button" class="cancel" data-pay="${o.code}" data-to="cod">Take cash instead</button></div>`;
  }
  return '';
}

function orderCard(o) {
  const waiting = o.status === 'awaiting_payment';
  const hold = waiting ? `<div class="hold">${o.payment_status === 'claimed'
    ? `💳 Customer says they paid ${rupees(o.total)}. Check your UPI app; the order is confirmed when you tap <b>Payment received</b>.`
    : '⏳ Waiting for the customer to pay by UPI. <b>Don\'t cook yet.</b> Cancelled automatically if not paid in time.'}</div>` : '';
  const map = o.lat != null ? ` · <a href="https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}" target="_blank" rel="noopener">map</a>` : '';
  return `<div class="order ${o.status}">
    <h4><span>${esc(o.code)}</span><span class="chip">${o.fulfilment === 'delivery' ? '🛵 Delivery' : '🏃 Pickup'} · ${o.channel === 'whatsapp' ? 'WhatsApp' : 'Web'}</span></h4>
    <div class="small muted">${ago(o.created_at)} · ${esc(o.statusLabel)}${state.outletId ? '' : ' · ' + esc(BRAND.short(o.outlet.name))}</div>
    ${hold}
    <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(i.name)}${i.note ? ` <b style="color:var(--brand)">(${esc(i.note)})</b>` : ''}</li>`).join('')}</ul>
    ${o.notes ? `<div class="small"><b>Note:</b> ${esc(o.notes)}</div>` : ''}
    <div class="small"><b>${esc(o.customer_name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>
    ${o.address ? `<div class="small">${esc(o.address)}${o.distance_km != null ? ` (${o.distance_km} km)` : ''}${map}</div>` : ''}
    <div style="margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${rupees(o.total)}</b>${o.fulfilment === 'delivery' ? ` <span class="small muted">incl. delivery ${rupees(o.delivery_fee)}</span>` : ''} <span class="chip pay-${o.payment_status}">${esc(o.paymentLabel)}</span></div>
    ${payActions(o)}
    ${deliveryBlock(o)}
    <div class="actions">${o.nextStatuses.map((s) => `<button type="button" class="${s === 'cancelled' ? 'cancel' : ''}" data-code="${o.code}" data-status="${s}">${NEXT_LABEL[s]}</button>`).join('')}</div>
  </div>`;
}

async function renderOrders() {
  const q = new URLSearchParams();
  if (state.outletId) q.set('outletId', state.outletId);
  if (state.view === 'history') q.set('status', 'all');
  const orders = await api('/orders?' + q);
  if (state.view === 'live') {
    // Beep for a new order to cook, and for a customer saying they paid (staff must check).
    // A UPI order that was waiting beeps when its payment is confirmed, not before.
    const key = (o) => `${o.code}:${o.status}:${o.payment_status}`;
    const fresh = orders.filter((o) => (o.status === 'placed' || o.payment_status === 'claimed') && !state.seen.has(key(o)));
    if (fresh.length && !state.firstLoad) beep();
    orders.forEach((o) => state.seen.add(key(o)));
    state.firstLoad = false;
  }
  const waiting = state.view === 'live' ? orders.filter((o) => o.status === 'awaiting_payment') : [];
  const rest = orders.filter((o) => !waiting.includes(o));
  $('view').innerHTML = (waiting.length ? `<h3 class="section">Waiting for payment (${waiting.length})</h3><div class="grid waiting">${waiting.map(orderCard).join('')}</div>` : '')
    + (waiting.length && rest.length ? '<h3 class="section">Orders</h3>' : '')
    + (rest.length ? `<div class="grid">${rest.map(orderCard).join('')}</div>` : (waiting.length ? '' : '<p class="muted">No orders here yet.</p>'));
}

function chatCard(h) {
  const outlet = state.outlets.find((o) => o.id === h.outlet_id);
  return `<div class="chat">
    <h4 style="margin:0;display:flex;justify-content:space-between;gap:8px"><span>💬 ${esc(h.name || 'Customer')} · <a href="tel:+${esc(h.phone)}">+${esc(h.phone)}</a></span>
      <span class="chip">${outlet ? esc(BRAND.short(outlet.name)) : 'No outlet yet'}</span></h4>
    <div class="small muted">Opened ${ago(h.created_at)}</div>
    <div class="bubbles">${h.messages.map((m) => `<div class="b ${m.direction}">${esc(m.body)}</div>`).join('')}</div>
    <form data-chat="${h.id}"><input name="text" placeholder="Reply on WhatsApp…" autocomplete="off" required><button class="btn">Send</button></form>
    <button type="button" class="btn secondary" data-close-chat="${h.id}">Close chat & hand back to bot</button>
  </div>`;
}

async function loadChats() {
  const chats = await api('/chats' + (state.outletId ? `?outletId=${state.outletId}` : ''));
  // Alert on new customer messages.
  let fresh = false;
  for (const h of chats) {
    const lastIn = h.messages.filter((m) => m.direction === 'in').length;
    if (state.chatsLoaded && lastIn > (state.chatSeen.get(h.id) ?? -1)) fresh = true;
    state.chatSeen.set(h.id, lastIn);
  }
  if (fresh) beep();
  state.chatsLoaded = true;
  $('chatCount').textContent = chats.length || '';
  return chats;
}

async function renderChats(chats) {
  // Don't wipe a reply someone is typing.
  if (document.activeElement?.closest?.('[data-chat]')) return;
  $('view').innerHTML = chats.length ? `<div class="grid">${chats.map(chatCard).join('')}</div>` : '<p class="muted">No open chats. Customers reach staff by typing "talk to us" on WhatsApp.</p>';
  $('view').querySelectorAll('.bubbles').forEach((b) => { b.scrollTop = b.scrollHeight; });
}

async function renderStats() {
  const rows = await api('/summary');
  const name = (id) => BRAND.short(state.outlets.find((o) => o.id === id)?.name);
  const shown = state.outletId ? rows.filter((r) => r.outlet_id === Number(state.outletId)) : rows;
  const total = shown.reduce((t, r) => ({ orders: t.orders + r.orders, revenue: t.revenue + r.revenue }), { orders: 0, revenue: 0 });
  $('stats').innerHTML = `<div class="stat">Today: <b>${total.orders}</b> order${total.orders === 1 ? '' : 's'} ·<b>${rupees(total.revenue)}</b></div>`
    + (state.outletId ? '' : shown.map((r) => `<div class="stat">${esc(name(r.outlet_id))}: ${r.orders} · ${rupees(r.revenue)}</div>`).join(''));
}

// Outlet panel: what head office has set, read only.
async function renderOutletStock() {
  const items = await api('/stock');
  const out = items.filter((i) => !i.available);
  const low = items.filter((i) => i.available && i.remaining != null);
  const row = (i) => `<tr><td>${esc(i.name)}<br><span class="small muted">${esc(i.category)}</span></td><td class="n">${
    i.remaining == null ? '<span class="chip">Off by head office</span>' : i.remaining === 0 ? '<span class="chip">Sold out (0 left)</span>' : `<b>${i.remaining}</b> left`}</td></tr>`;
  $('view').innerHTML = `<p class="small muted">Stock is managed by head office. Call them to switch a dish on or off or to change a count. Counts go down by themselves as orders come in.</p>
    <div class="two">
      <div class="card"><header><h3>Not available now (${out.length})</h3></header>
        <div class="table-wrap"><table class="data"><tbody>${out.map(row).join('') || '<tr><td class="muted">Everything is available.</td></tr>'}</tbody></table></div></div>
      <div class="card"><header><h3>Limited stock (${low.length})</h3></header>
        <div class="table-wrap"><table class="data"><tbody>${low.sort((a, b) => a.remaining - b.remaining).map(row).join('') || '<tr><td class="muted">No counts set.</td></tr>'}</tbody></table></div></div>
    </div>`;
}

async function refresh() {
  try {
    const chats = await loadChats();
    const insights = PANEL === 'admin' && window.RCInsights?.[state.view];
    const view = insights ? insights() : state.view === 'chats' ? renderChats(chats)
      : state.view === 'stock' ? renderOutletStock() : renderOrders();
    await Promise.all([view, renderStats()]);
  } catch (e) {
    if (e.message !== 'unauthorized') console.error(e);
  }
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-status]');
  if (b) {
    if (b.dataset.status === 'cancelled' && !confirm(`Cancel order ${b.dataset.code}?`)) return;
    b.disabled = true;
    try { await api(`/orders/${b.dataset.code}/status`, { method: 'POST', body: { status: b.dataset.status } }); } catch (err) { alert(err.message); }
    refresh();
  }
  const del = e.target.closest('[data-delivery]');
  if (del) {
    del.disabled = true;
    try { await api(`/orders/${del.dataset.delivery}/delivery`, { method: 'POST', body: { action: del.dataset.action } }); } catch (err) { alert(err.message); }
    refresh();
  }
  const pay = e.target.closest('[data-pay]');
  if (pay) {
    pay.disabled = true;
    try { await api(`/orders/${pay.dataset.pay}/payment`, { method: 'POST', body: { status: pay.dataset.to } }); } catch (err) { alert(err.message); }
    refresh();
  }
  const c = e.target.closest('[data-close-chat]');
  if (c) {
    try { await api(`/chats/${c.dataset.closeChat}/close`, { method: 'POST' }); } catch (err) { alert(err.message); }
    refresh();
  }
  const v = e.target.closest('[data-view]');
  if (v) setView(v.dataset.view);
});

function setView(view) {
  state.view = view;
  document.querySelector('.viz-tip')?.setAttribute('hidden', '');
  document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('on', x.dataset.view === view));
  return refresh();
}

// Shared with insights.js (Customers, Menu, Analytics).
window.RCAdmin = { api, state, refresh, setView };

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-chat]');
  if (!f) return;
  e.preventDefault();
  const input = f.elements.text;
  try {
    await api(`/chats/${f.dataset.chat}/reply`, { method: 'POST', body: { text: input.value } });
    input.value = '';
    input.blur();
  } catch (err) { alert(err.message); }
  refresh();
});

$('outlet')?.addEventListener('change', (e) => {
  state.outletId = e.target.value;
  store.set('outlet', state.outletId);
  syncAccepting();
  refresh();
});

function syncAccepting() {
  const o = state.outlets.find((x) => String(x.id) === String(state.outletId));
  $('accepting').parentElement.classList.toggle('hidden', !o);
  if (o) $('accepting').checked = !!o.accepting_orders;
}

$('accepting').addEventListener('change', async (e) => {
  try {
    const o = await api(PANEL === 'outlet' ? '/me' : `/outlets/${state.outletId}`, { method: 'PATCH', body: { acceptingOrders: e.target.checked } });
    state.outlets = state.outlets.map((x) => (x.id === o.id ? o : x));
  } catch (err) { alert(err.message); e.target.checked = !e.target.checked; }
});

let poll;
async function start() {
  // Demo: the outlet tablet signs itself in to the outlet the demo picked.
  if (!state.token && PANEL === 'outlet' && window.RC_DEMO_LOGIN) {
    const res = await fetch('/api/outlet/login', { method: 'POST', body: JSON.stringify(window.RC_DEMO_LOGIN) });
    state.token = (await res.json()).token || '';
  }
  if (!state.token) return showLogin();
  try {
    if (PANEL === 'outlet') {
      // An outlet tablet is locked to its own outlet.
      const me = await api('/me');
      state.outlets = [me];
      state.outletId = String(me.id);
      $('outletName').textContent = BRAND.short(me.name);
    } else {
      state.outlets = await api('/outlets');
    }
  } catch { return; }
  $('login').classList.add('hidden');
  $('dash').classList.remove('hidden');
  if (PANEL === 'admin') {
    $('outlet').innerHTML = '<option value="">All outlets</option>' + state.outlets.map((o) => `<option value="${o.id}">${esc(o.name)}</option>`).join('');
    $('outlet').value = state.outletId;
  }
  syncAccepting();
  refresh();
  clearInterval(poll);
  // Live views refresh themselves; back-office views refresh when you act.
  poll = setInterval(() => { if (['live', 'chats', 'history'].includes(state.view) || (PANEL === 'outlet' && state.view === 'stock')) refresh(); else loadChats().catch(() => {}); }, 5000);
}

start();
</script>
  <script>'use strict';

// Admin views for the back office: Customers (CRM + loyalty), Menu
// (dish editing, one-click price changes) and Analytics. Stock and outlet
// logins are in control.js.
// Loaded after staff/panel.js; uses its api(), state, rupees(), esc() helpers.

(() => {
  const $ = (id) => document.getElementById(id);
  const num = (n) => Number(n || 0).toLocaleString('en-IN');
  const pct = (x, d = 0) => `${(x * 100).toFixed(d)}%`;
  const short = (name) => BRAND.short(String(name || ''));
  const outletName = (id) => short(window.RCAdmin.state.outlets.find((o) => o.id === id)?.name || '—');
  const dateFmt = (iso) => (iso ? new Date(iso).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' }) : '—');
  // esc() and rupees() come from staff/panel.js.
  const kRupees = (p) => {
    const r = p / 100;
    if (r >= 1e7) return `₹${(r / 1e7).toFixed(1)}Cr`;
    if (r >= 1e5) return `₹${(r / 1e5).toFixed(1)}L`;
    if (r >= 1e3) return `₹${(r / 1e3).toFixed(1)}k`;
    return `₹${Math.round(r)}`;
  };

  // ---- Shared bits ------------------------------------------------------

  // One tooltip for every chart; marks carry data-tip / data-tip-title.
  const tip = document.createElement('div');
  tip.className = 'viz-tip';
  tip.setAttribute('role', 'tooltip');
  tip.hidden = true;
  document.body.appendChild(tip);
  function showTip(el, x, y) {
    tip.replaceChildren();
    const v = document.createElement('b');
    v.textContent = el.dataset.tip;
    const l = document.createElement('span');
    l.textContent = el.dataset.tipTitle || '';
    tip.append(v, l);
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = `${Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 12))}px`;
    tip.style.top = `${Math.max(8, y - r.height - 12)}px`;
  }
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest?.('[data-tip]');
    if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.addEventListener('focusin', (e) => {
    const el = e.target.closest?.('[data-tip]');
    if (!el) return;
    const r = el.getBoundingClientRect();
    showTip(el, r.left + r.width / 2, r.top);
  });
  document.addEventListener('focusout', () => { tip.hidden = true; });

  function download(filename, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const csv = (rows) => rows.map((r) => r.map((v) => (/[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? ''))).join(',')).join('\n') + '\n';

  // Horizontal magnitude bars as rows: label · bar · value. Values are text, so
  // nothing depends on hover.
  function barList(rows, { value, label, sub, fmt, max, tipTitle }) {
    const top = max ?? Math.max(1, ...rows.map(value));
    return `<div class="hbars">${rows.map((r) => `
      <div class="hbar" tabindex="0" data-tip="${esc(fmt(value(r)))}" data-tip-title="${esc(tipTitle ? tipTitle(r) : label(r))}">
        <span class="hb-label">${esc(label(r))}${sub ? `<small>${esc(sub(r))}</small>` : ''}</span>
        <span class="hb-track"><span class="hb-fill" style="width:${Math.max(0.5, (value(r) / top) * 100)}%"></span></span>
        <span class="hb-value">${esc(fmt(value(r)))}</span>
      </div>`).join('')}</div>`;
  }

  // ---- Analytics ----------------------------------------------------------

  const A = { preset: '30', from: '', to: '', channel: '', fulfilment: '', itemSort: 'revenue', data: null };
  const istToday = () => new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10);
  const shift = (day, n) => new Date(Date.parse(`${day}T00:00:00Z`) + n * 864e5).toISOString().slice(0, 10);

  function range() {
    const today = istToday();
    if (A.preset === 'custom' && A.from && A.to) return { from: A.from, to: A.to };
    if (A.preset === 'today') return { from: today, to: today };
    if (A.preset === 'month') return { from: `${today.slice(0, 8)}01`, to: today };
    return { from: shift(today, -(Number(A.preset) - 1)), to: today };
  }

  function delta(change, { goodWhenUp = true } = {}) {
    if (change == null || !Number.isFinite(change)) return '<span class="delta muted">no earlier data</span>';
    if (Math.abs(change) < 0.005) return '<span class="delta muted">→ no change</span>';
    const up = change > 0;
    const good = up === goodWhenUp;
    return `<span class="delta ${good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${pct(Math.abs(change), Math.abs(change) < 0.1 ? 1 : 0)}</span>`;
  }

  function tiles(d) {
    const s = d.summary;
    const c = d.change;
    const t = (label, value, ch, note, opts) => `<div class="tile"><span class="t-label">${label}</span><span class="t-value">${value}</span><span class="t-foot">${delta(ch, opts)}${note ? ` <span class="muted">${note}</span>` : ''}</span></div>`;
    return `<div class="tiles">
      ${t('Gross sales', rupees(s.grossSales), c.grossSales, 'incl. GST & delivery')}
      ${t('Orders', num(s.orders), c.orders)}
      ${t('Average order', rupees(s.aov), c.aov)}
      ${t('Customers', num(s.customers), c.customers, `${num(s.newCustomers)} new · ${num(s.returningCustomers)} returning`)}
      ${t('Item sales', rupees(s.itemSales), c.itemSales, 'food only')}
      ${t('Cancelled', `${num(s.cancelled)} <small>(${pct(s.cancelRate, 1)})</small>`, c.cancelRate, '', { goodWhenUp: false })}
      ${t('Delivery charges', rupees(s.deliveryFees), c.deliveryFees, `${num(s.deliveryOrders)} deliveries · avg ${s.avgDeliveryKm} km`)}
      ${t('GST collected', rupees(s.gst), c.gst)}
    </div>`;
  }

  // Columns on one axis: rows [{ value, label, tick, tipTitle, tip }].
  function columns(rows, { aria, fmt = kRupees, everyLabel }) {
    const W = 760; const H = 240; const L = 56; const R = 12; const T = 14; const B = 30;
    const max = Math.max(1, ...rows.map((r) => r.value));
    const raw = fmt === kRupees ? max / 100 : max;
    const step = 10 ** Math.floor(Math.log10(raw / 4 || 1));
    const nice = [1, 2, 2.5, 5, 10].map((m) => m * step).find((s) => raw / s <= 4) || step * 10;
    const unit = fmt === kRupees ? 100 : 1;
    const top = Math.max(nice, Math.ceil(raw / nice) * nice) * unit;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const bw = (W - L - R) / rows.length;
    const ticks = [];
    for (let v = 0; v <= top + 1e-9; v += nice * unit) ticks.push(v);
    const every = everyLabel || Math.ceil(rows.length / 8);
    return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
      ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${v ? 'grid' : 'base'}"/><text x="${L - 8}" y="${y(v) + 4}" class="tick" text-anchor="end">${fmt === kRupees ? kRupees(v) : num(Math.round(v))}</text>`).join('')}
      ${rows.map((d, i) => {
        const h = Math.max(d.value ? 2 : 0, y(0) - y(d.value));
        const x = L + i * bw + 1;
        const w = Math.max(1, bw - 2);
        const r = Math.min(4, w / 2, h);
        const path = h ? `M${x} ${y(0)}V${y(0) - h + r}Q${x} ${y(0) - h} ${x + r} ${y(0) - h}H${x + w - r}Q${x + w} ${y(0) - h} ${x + w} ${y(0) - h + r}V${y(0)}Z` : '';
        return `<g class="col" tabindex="0" data-tip="${esc(d.tip)}" data-tip-title="${esc(d.tipTitle)}">
          <rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" class="hit"/>
          ${path ? `<path d="${path}" class="bar${d.peak ? ' peak' : ''}"/>` : ''}
          ${i % every === 0 ? `<text x="${x + w / 2}" y="${H - 10}" class="tick" text-anchor="middle">${esc(d.tick)}</text>` : ''}
        </g>`;
      }).join('')}
    </svg>`;
  }

  function trendChart(daily) {
    return columns(daily.map((d) => ({
      value: d.sales, tick: dateFmt(`${d.date}T06:30:00Z`), tip: `${rupees(d.sales)} · ${d.orders} orders`,
      tipTitle: new Date(`${d.date}T00:00:00Z`).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', weekday: 'short', timeZone: 'UTC' }),
    })), { aria: 'Daily gross sales' });
  }

  const hh = (h) => `${h % 12 || 12}${h < 12 ? 'am' : 'pm'}`;
  function rushChart(hourly) {
    const peak = Math.max(...hourly.map((h) => h.orders));
    return columns(hourly.map((h) => ({
      value: h.orders, peak: peak && h.orders === peak, tick: hh(h.hour), tip: `${num(h.orders)} orders · ${rupees(h.sales)}`, tipTitle: `${hh(h.hour)}–${hh((h.hour + 1) % 24)}`,
    })), { aria: 'Orders by hour of day', fmt: num, everyLabel: 3 });
  }

  const minFmt = (m) => (m == null ? '—' : `${Math.round(m)} min`);
  const starText = (avg, n) => (avg == null ? '<span class="muted">—</span>' : `★ ${avg.toFixed(1)} <span class="small muted">(${num(n)})</span>`);

  // Star ratings collected on WhatsApp after delivery.
  function reviewsSection(r) {
    const dist = barList(r.distribution, { value: (x) => x.count, label: (x) => `${x.stars} star${x.stars > 1 ? 's' : ''}`, fmt: (v) => num(v), tipTitle: (x) => `${x.stars}-star reviews` });
    return `<section class="card"><header><h3>Reviews</h3><span class="muted small">Asked on WhatsApp 30 min after delivery · 1–5 stars</span><button type="button" class="link" data-csv="ratings">Export CSV</button></header>
      <div class="tiles">
        <div class="tile"><span class="t-label">Average rating</span><span class="t-value">${r.average == null ? '—' : `★ ${r.average.toFixed(2)}`}</span><span class="t-foot muted">whole order</span></div>
        <div class="tile"><span class="t-label">Reviews</span><span class="t-value">${num(r.count)}</span><span class="t-foot muted">${pct(r.responseRate)} of completed orders</span></div>
      </div>
      <div class="two">
        <div><h4>Rating spread</h4>${dist}</div>
        <div><h4>By outlet</h4><div class="table-wrap"><table class="data"><tbody>
          ${r.byOutlet.map((o) => `<tr><td>${esc(short(o.name))}</td><td class="n">${starText(o.average, o.count)}</td></tr>`).join('')}
        </tbody></table></div></div>
      </div>
      <h4>Dish ratings</h4>
      <div class="table-wrap"><table class="data"><thead><tr><th>Dish</th><th class="n">Average</th><th class="n">Ratings</th><th class="n">1–2 stars</th></tr></thead><tbody>
        ${r.byItem.map((i) => `<tr><td>${esc(i.name)}</td><td class="n">★ ${i.average.toFixed(2)}</td><td class="n">${num(i.count)}</td><td class="n">${i.low ? `<b class="delta bad">${num(i.low)}</b>` : '0'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No dish ratings yet.</td></tr>'}
      </tbody></table></div>
      <h4>What customers said</h4>
      <div class="table-wrap"><table class="data"><tbody>
        ${r.comments.map((c) => `<tr><td>${c.stars != null ? `★ ${c.stars} · ` : ''}${esc(c.comment)}<br><span class="small muted">${esc(c.name || '')} · ${esc(c.code || '')} · ${esc(outletName(c.outletId))} · ${esc(dateFmt(c.at))}</span></td></tr>`).join('') || '<tr><td class="muted">No comments yet.</td></tr>'}
      </tbody></table></div>
    </section>`;
  }

  function heatmap(m) {
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const max = Math.max(1, ...m.flat());
    const level = (n) => (n ? Math.min(7, 1 + Math.floor((n / max) * 6.999)) : 0);
    const hours = [...Array(24).keys()];
    return `<div class="heat" role="table" aria-label="Orders by weekday and hour">
      <span></span>${hours.map((h) => `<span class="hh">${h % 3 === 0 ? hh(h) : ''}</span>`).join('')}
      ${m.map((row, d) => `<span class="hd">${days[d]}</span>${row.map((n, h) => `<span class="cell l${level(n)}" tabindex="0" data-tip="${n} order${n === 1 ? '' : 's'}" data-tip-title="${days[d]} ${hh(h)}–${hh((h + 1) % 24)}"></span>`).join('')}`).join('')}
    </div>
    <div class="heat-key"><span>Fewer</span>${[1, 2, 3, 4, 5, 6, 7].map((l) => `<span class="cell l${l}"></span>`).join('')}<span>More orders</span></div>`;
  }

  function itemsTable(items) {
    const key = { revenue: (r) => r.revenue, qty: (r) => r.qty, orders: (r) => r.orders }[A.itemSort];
    const rows = [...items].sort((a, b) => key(b) - key(a));
    return `<div class="table-wrap"><table class="data">
      <thead><tr><th>#</th><th>Dish</th><th>Category</th><th class="n">Qty sold</th><th class="n">Revenue</th><th class="n">Share</th><th class="n">In % of orders</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td><span class="vegmark ${r.veg ? '' : 'non'}"></span>${esc(r.name)}</td><td>${esc(r.category)}</td>
        <td class="n">${num(r.qty)}</td><td class="n">${rupees(r.revenue)}</td><td class="n">${pct(r.share, 1)}</td><td class="n">${pct(r.attachRate, 1)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }

  async function renderAnalytics(ctx) {
    const r = range();
    const q = new URLSearchParams({ from: r.from, to: r.to });
    if (ctx.state.outletId) q.set('outletId', ctx.state.outletId);
    if (A.channel) q.set('channel', A.channel);
    if (A.fulfilment) q.set('fulfilment', A.fulfilment);
    const view = $('view');
    view.classList.add('loading');
    const d = await ctx.api('/analytics?' + q);
    view.classList.remove('loading');
    A.data = d;
    const prevDays = d.range.days === 1 ? 'the day before' : `previous ${d.range.days} days`;
    view.innerHTML = `
      <div class="filters" role="group" aria-label="Analytics filters">
        <div class="seg">${[['today', 'Today'], ['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['month', 'This month'], ['custom', 'Custom']]
          .map(([k, l]) => `<button type="button" data-preset="${k}" class="${A.preset === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <span class="${A.preset === 'custom' ? '' : 'hidden'}"><input type="date" id="aFrom" value="${esc(A.from || r.from)}"> – <input type="date" id="aTo" value="${esc(A.to || r.to)}"></span>
        <select id="aChannel" aria-label="Channel"><option value="">All channels</option><option value="whatsapp" ${A.channel === 'whatsapp' ? 'selected' : ''}>WhatsApp</option><option value="web" ${A.channel === 'web' ? 'selected' : ''}>Web app</option></select>
        <select id="aFulfil" aria-label="Order type"><option value="">Delivery + pickup</option><option value="delivery" ${A.fulfilment === 'delivery' ? 'selected' : ''}>Delivery</option><option value="pickup" ${A.fulfilment === 'pickup' ? 'selected' : ''}>Pickup</option></select>
        <span class="muted small">${esc(dateFmt(`${d.range.from}T06:30:00Z`))} – ${esc(dateFmt(`${d.range.to}T06:30:00Z`))} · ${ctx.state.outletId ? esc(outletName(Number(ctx.state.outletId))) : 'All outlets'} · changes vs ${prevDays}</span>
      </div>
      ${tiles(d)}
      <section class="card"><header><h3>Daily sales</h3><span class="muted small">Gross sales per day. Hover a day for orders.</span></header>${trendChart(d.daily)}</section>
      <div class="two">
        <section class="card"><header><h3>Outlet-wise sales</h3><button type="button" class="link" data-csv="outlets">Export CSV</button></header>
          ${barList(d.outlets, { value: (o) => o.sales, label: (o) => short(o.name), sub: (o) => `${num(o.orders)} orders · avg ${rupees(o.aov)} · ${pct(o.share)}`, fmt: rupees })}
        </section>
        <section class="card"><header><h3>Category mix</h3></header>
          ${barList(d.categories, { value: (c) => c.revenue, label: (c) => c.category, sub: (c) => `${num(c.qty)} sold · ${pct(c.share)}`, fmt: rupees })}
        </section>
      </div>
      <section class="card"><header><h3>Most popular dishes</h3><span class="muted small">Top 10 by revenue</span></header>
        ${barList(d.items.slice(0, 10), { value: (i) => i.revenue, label: (i) => `${i.rank}. ${i.name}`, sub: (i) => `${num(i.qty)} sold · in ${pct(i.attachRate)} of orders`, fmt: rupees })}
      </section>
      <section class="card"><header><h3>Rush hours</h3><span class="muted small">Orders by hour of day (IST); the busiest hour is darker</span></header>
        ${rushChart(d.rush.hourly)}
        <div class="two" style="margin-top:12px">
          <div><h4>Busiest slots</h4><div class="table-wrap"><table class="data"><tbody>
            ${d.rush.busiestSlots.map((x, i) => `<tr><td>${i + 1}. ${esc(x.day)} ${hh(x.hour)}–${hh((x.hour + 1) % 24)}</td><td class="n">${num(x.orders)} orders</td></tr>`).join('') || '<tr><td class="muted">No orders.</td></tr>'}
          </tbody></table></div></div>
          <div><h4>Peak hour by outlet</h4><div class="table-wrap"><table class="data"><tbody>
            ${d.rush.outletPeaks.map((p) => `<tr><td>${esc(short(p.name))}</td><td class="n">${p.peakHour == null ? '—' : `${hh(p.peakHour)} · ${num(p.peakOrders)} orders`}</td></tr>`).join('')}
          </tbody></table></div></div>
        </div>
      </section>
      <section class="card"><header><h3>Kitchen and delivery speed</h3><span class="muted small">From order status times · ${num(d.speed.measured)} orders measured</span></header>
        <div class="tiles">
          <div class="tile"><span class="t-label">Time to accept</span><span class="t-value">${minFmt(d.speed.acceptMin)}</span></div>
          <div class="tile"><span class="t-label">Kitchen prep</span><span class="t-value">${minFmt(d.speed.prepMin)}</span><span class="t-foot muted">accepted → ready / rider picks up</span></div>
          <div class="tile"><span class="t-label">Delivery ride</span><span class="t-value">${minFmt(d.speed.rideMin)}</span></div>
          <div class="tile"><span class="t-label">Order to doorstep</span><span class="t-value">${minFmt(d.speed.totalDeliveryMin)}</span></div>
        </div>
        <div class="two">
          <div><h4>By hour: does the rush slow us down?</h4><div class="table-wrap"><table class="data"><thead><tr><th>Hour</th><th class="n">Orders</th><th class="n">Prep</th><th class="n">Order to door</th></tr></thead><tbody>
            ${d.speed.byHour.filter((h) => h.orders).map((h) => `<tr><td>${hh(h.hour)}</td><td class="n">${num(h.orders)}</td><td class="n">${minFmt(h.prepMin)}</td><td class="n">${minFmt(h.totalMin)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No orders.</td></tr>'}

  const C = { q: '', segment: 'all', optIn: false, sort: 'last', open: null };

  function customersQuery(ctx) {
    const q = new URLSearchParams({ segment: C.segment, sort: C.sort });
    if (C.q) q.set('q', C.q);
    if (C.optIn) q.set('optIn', '1');
    if (ctx.state.outletId) q.set('outletId', ctx.state.outletId);
    return q;
  }

  // ---- Menu management ------------------------------------------------------

  const M = { scope: 'all', category: '', mode: 'percent', value: '', round: '1', selected: new Set(), preview: null, msg: '' };

    const { items, lastChange } = await ctx.api('/menu');
    const cats = [...new Set(items.map((i) => i.category))];

    $('view').innerHTML = `
      <section class="card bulk">
        <header><h3>Change prices in one click</h3>${lastChange ? `<button type="button" class="btn secondary" style="width:auto" id="mUndo">↶ Undo: ${esc(lastChange.note)}</button>` : ''}</header>
        <div class="row wrap">

          <select id="mCat" aria-label="Category" class="${M.scope === 'category' ? '' : 'hidden'}">${cats.map((c) => `<option ${c === M.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>

          <button type="button" class="btn" style="width:auto" id="mPreview">Preview</button>
        </div>
        <div class="row wrap quick">${[['percent', 5], ['percent', 10], ['percent', -5], ['amount', 10], ['amount', -10]].map(([m, v]) => `<button type="button" class="chip" data-quick="${m}:${v}">${v > 0 ? '+' : '−'}${m === 'percent' ? `${Math.abs(v)}%` : `₹${Math.abs(v)}`}</button>`).join('')}</div>
        ${M.msg ? `<p class="small" role="status">${esc(M.msg)}</p>` : ''}
        ${M.preview ? `<div class="preview">

          ${M.preview.changes.map((c) => `<tr><td>${esc(c.name)}</td><td class="n">${rupees(c.oldPrice)}</td><td class="n"><b>${rupees(c.newPrice)}</b></td></tr>`).join('')}</tbody></table></div>
          <div class="row"><button type="button" class="btn" style="width:auto" id="mApply">Apply new prices</button><button type="button" class="btn secondary" style="width:auto" id="mCancel">Cancel</button></div>

      </section>
      <section class="card">

        <div class="table-wrap"><table class="data menu-table">

          <input name="price" type="number" min="1" step="1" placeholder="Price ₹" required style="max-width:110px">

  // ---- Events -------------------------------------------------------------

  const ctx = () => window.RCAdmin;
  const rerender = () => window.RCAdmin.refresh();

  document.addEventListener('click', async (e) => {
    const t = e.target;
    const p = t.closest('[data-preset]');
    if (p) { A.preset = p.dataset.preset; if (A.preset === 'custom') { const r = range(); A.from = A.from || r.from; A.to = A.to || r.to; } return rerender(); }
    const csvBtn = t.closest('[data-csv]');
    if (csvBtn && A.data) {
      if (csvBtn.dataset.csv === 'ratings') {
        download(`dish-ratings-${A.data.range.from}-to-${A.data.range.to}.csv`, csv([['dish', 'average_stars', 'ratings', 'one_or_two_stars'],
          ...A.data.reviews.byItem.map((i) => [i.name, i.average, i.count, i.low])]));
        return;
      }
      if (csvBtn.dataset.csv === 'combos') {
        download(`combinations-${A.data.range.from}-to-${A.data.range.to}.csv`, csv([['dish_1', 'dish_2', 'orders', 'pct_of_orders', 'dish1_takers_also_take_dish2', 'revenue_rs'],
          ...A.data.combinations.map((c) => [c.items[0], c.items[1], c.orders, (c.share * 100).toFixed(1), (c.withA * 100).toFixed(0), (c.revenue / 100).toFixed(2)])]));
        return;
      }
      if (csvBtn.dataset.csv === 'items') {
        download(`item-sales-${A.data.range.from}-to-${A.data.range.to}.csv`, csv([['rank', 'dish', 'category', 'qty', 'revenue_rs', 'share', 'orders', 'in_pct_of_orders'],
          ...A.data.items.map((i) => [i.rank, i.name, i.category, i.qty, (i.revenue / 100).toFixed(2), (i.share * 100).toFixed(1), i.orders, (i.attachRate * 100).toFixed(1)])]));
      } else {
        download(`outlet-sales-${A.data.range.from}-to-${A.data.range.to}.csv`, csv([['outlet', 'orders', 'sales_rs', 'avg_order_rs', 'share', 'cancelled', 'deliveries', 'items_sold'],
          ...A.data.outlets.map((o) => [o.name, o.orders, (o.sales / 100).toFixed(2), (o.aov / 100).toFixed(2), (o.share * 100).toFixed(1), o.cancelled, o.delivery, o.itemsSold])]));
      }
      return;
    }
    const go = t.closest('[data-goto]');
    if (go) return window.RCAdmin.setView(go.dataset.goto);
    const seg = t.closest('[data-seg]');
    if (seg) { C.segment = seg.dataset.seg; return rerender(); }
    const row = t.closest('[data-customer]');
    if (row) return openCustomer(ctx(), row.dataset.customer);
    if (t.closest('[data-close-customer]')) { C.open = null; $('crmDetail').innerHTML = ''; return; }
    if (t.id === 'cExport') {
      const res = await fetch('/api/admin/customers.csv?' + customersQuery(ctx()), { headers: { Authorization: 'Bearer ' + ctx().state.token } });
      return download(`${BRAND.id}-customers.csv`, await res.text());
    }
    const quick = t.closest('[data-quick]');
    if (quick) { const [m, v] = quick.dataset.quick.split(':'); M.mode = m; M.value = v; return previewPrices(); }
    if (t.id === 'mPreview') { M.value = $('mValue').value; return previewPrices(); }
    if (t.id === 'mCancel') { M.preview = null; return rerender(); }
    if (t.id === 'mApply') {
      try {
        const r = await ctx().api('/menu/bulk-price', { method: 'POST', body: { ...bulkBody(), apply: true } });
        M.msg = `Done: ${r.label}. ${r.changes.length} prices updated. Undo is available above.`;
      } catch (err) { M.msg = err.message; }
      M.preview = null;
      return rerender();
    }
    if (t.id === 'mUndo') {
      try { const r = await ctx().api('/menu/undo', { method: 'POST' }); M.msg = `Undone: ${r.undone}.`; } catch (err) { M.msg = err.message; }
      return rerender();
    }
  });

  function bulkBody() {
    return { scope: M.scope, category: M.category, itemIds: [...M.selected], mode: M.mode, value: Number(M.value), round: Number(M.round) };
  }

  async function previewPrices() {
    try {
      M.preview = await ctx().api('/menu/bulk-price', { method: 'POST', body: bulkBody() });
      M.msg = M.preview.changes.length ? '' : 'Those prices would not change after rounding.';
      if (!M.preview.changes.length) M.preview = null;
    } catch (err) { M.preview = null; M.msg = err.message; }
    rerender();
  }

  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.id === 'aFrom' || t.id === 'aTo') { A.from = $('aFrom').value; A.to = $('aTo').value; if (A.from && A.to && A.from <= A.to) rerender(); return; }
    if (t.id === 'aChannel') { A.channel = t.value; return rerender(); }
    if (t.id === 'aFulfil') { A.fulfilment = t.value; return rerender(); }
    if (t.id === 'aItemSort') { A.itemSort = t.value; return rerender(); }
    if (t.id === 'cOptIn') { C.optIn = t.checked; return rerender(); }
    if (t.id === 'cSort') { C.sort = t.value; return rerender(); }
    if (t.id === 'mScope') { M.scope = t.value; M.preview = null; return rerender(); }
    if (t.id === 'mCat') { M.category = t.value; return; }
    if (t.id === 'mMode') { M.mode = t.value; return; }
    if (t.id === 'mRound') { M.round = t.value; return; }
    if (t.dataset.select) { const id = Number(t.dataset.select); if (t.checked) M.selected.add(id); else M.selected.delete(id); return; }
    if (t.dataset.field) {
      const f = t.dataset.field;
      const value = t.type === 'checkbox' ? t.checked : t.value;
      try {
        await ctx().api(`/menu/${t.dataset.id}`, { method: 'PATCH', body: { [f]: f === 'price' ? Number(value) : value } });
        t.classList.add('saved');
        setTimeout(() => t.classList.remove('saved'), 900);
        if (f === 'active' || f === 'price') { M.msg = f === 'price' ? 'Price saved. Undo is available above.' : ''; rerender(); }
      } catch (err) { M.msg = err.message; rerender(); }
    }
  });

  let searchTimer;
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'cSearch') return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { C.q = e.target.value; rerender().then(() => { const s = $('cSearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }); }, 300);
  });

  document.addEventListener('submit', async (e) => {
    const f = e.target;
    if (f.id === 'mAdd') {
      e.preventDefault();
      try {
        await ctx().api('/menu', { method: 'POST', body: { name: f.name.value, category: f.category.value, price: Number(f.price.value), veg: f.veg.checked } });
        M.msg = `Added ${f.name.value}.`;
      } catch (err) { M.msg = err.message; }
      return rerender();
    }
    if (f.dataset.points) {
      e.preventDefault();
      try {
        const pts = Number(f.points.value);
        await ctx().api(`/customers/${encodeURIComponent(f.dataset.points)}/points`, { method: 'POST', body: { points: pts, note: f.note.value, kind: pts < 0 ? 'redeem' : 'adjust' } });
        await openCustomer(ctx(), f.dataset.points, false);
      } catch (err) { alert(err.message); }
      return;
    }
    if (f.dataset.profile) {
      e.preventDefault();
      await ctx().api(`/customers/${encodeURIComponent(f.dataset.profile)}`, { method: 'PATCH', body: { optIn: f.optIn.checked, tags: f.tags.value, notes: f.notes.value } });
      return rerender();
    }
  });

  const view = (fn) => () => { tip.hidden = true; return fn(ctx()); };
  window.RCInsights = { analytics: view(renderAnalytics), customers: view(renderCustomers), menu: view(renderMenu) };
})();
</script>
  <script>'use strict';

// Head office controls: Stock (every dish at every outlet: on/off and how many
// are left) and Outlets (accepting orders, outlet panel PINs, signed-in tablets).
// Loaded after staff/panel.js and insights.js; registers its views on RCInsights.

(() => {
  const $ = (id) => document.getElementById(id);
  const short = (name) => BRAND.short(String(name || ''));
  const when = (iso) => (iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—');
  const LOW = 5;
  const S = { q: '', category: '', show: 'all', msg: '' };

  // ---- Stock ----------------------------------------------------------------

  function cell(item, outletId, c) {
    const label = `${item.name} at ${short(window.RCAdmin.state.outlets.find((o) => o.id === outletId)?.name)}`;
    const cls = !c.on ? 'off' : c.remaining === 0 ? 'out' : c.remaining != null && c.remaining <= LOW ? 'low' : '';
    return `<td class="stock-cell ${cls}">
      <label><input type="checkbox" data-stock-on="${outletId}" data-item="${item.id}" ${c.on ? 'checked' : ''} aria-label="${esc(label)} available" style="width:auto"> ${c.on ? 'On' : 'Off'}</label>
      <input type="number" min="0" step="1" inputmode="numeric" data-stock-count="${outletId}" data-item="${item.id}" value="${c.remaining ?? ''}" placeholder="no limit" aria-label="${esc(label)}: how many left">
    </td>`;
  }

  async function renderStock(ctx) {
    if (document.activeElement?.closest?.('#view .stock-table input, #view .stock-filters input')) return;
    const board = await ctx.api('/stock');
    const outlets = ctx.state.outletId ? board.outlets.filter((o) => String(o.id) === String(ctx.state.outletId)) : board.outlets;
    const cats = [...new Set(board.items.map((i) => i.category))];
    const cells = (i) => outlets.map((o) => i.outlets[o.id]);
    const counts = { off: 0, out: 0, low: 0 };
    for (const i of board.items) {
      for (const c of cells(i)) {
        if (!c.on) counts.off += 1;
        else if (c.remaining === 0) counts.out += 1;
        else if (c.remaining != null && c.remaining <= LOW) counts.low += 1;
      }
    }
    const q = S.q.trim().toLowerCase();
    const items = board.items.filter((i) => (!S.category || i.category === S.category) && (!q || i.name.toLowerCase().includes(q))
      && (S.show === 'all' || cells(i).some((c) => (S.show === 'off' ? !c.on || c.remaining === 0 : c.remaining != null))));
    $('view').innerHTML = `
      <div class="tiles">
        <div class="tile"><span class="t-label">Switched off</span><span class="t-value">${counts.off}</span><span class="t-foot muted">dish × outlet</span></div>
        <div class="tile"><span class="t-label">Sold out (count at 0)</span><span class="t-value">${counts.out}</span><span class="t-foot muted">dish × outlet</span></div>
        <div class="tile"><span class="t-label">Running low (${LOW} or fewer)</span><span class="t-value">${counts.low}</span><span class="t-foot muted">dish × outlet</span></div>
      </div>
      <section class="card">
        <header><h3>Stock ${ctx.state.outletId ? `at ${esc(short(outlets[0]?.name))}` : 'at every outlet'}</h3>
          <span class="muted small">Only head office can change stock. Tick to sell a dish at an outlet; enter how many are left to sell only that many (orders count it down, cancellations add back, 0 = sold out). Empty = no limit.</span></header>
        <div class="filters stock-filters">
          <input type="search" id="sQ" placeholder="Search dish" value="${esc(S.q)}" aria-label="Search dish">
          <select id="sCat" aria-label="Category"><option value="">All categories</option>${cats.map((c) => `<option ${c === S.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
          <div class="seg" role="group" aria-label="Show">${[['all', 'All dishes'], ['off', 'Off or sold out'], ['count', 'With a count']].map(([k, l]) => `<button type="button" data-stock-show="${k}" class="${S.show === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        </div>
        ${S.msg ? `<p class="small" role="status">${esc(S.msg)}</p>` : ''}
        <div class="table-wrap"><table class="data stock-table">
          <thead><tr><th>Dish</th>${outlets.map((o) => `<th>${esc(short(o.name))}${o.accepting ? '' : ' <span class="chip">paused</span>'}</th>`).join('')}${outlets.length > 1 ? '<th>All outlets</th>' : ''}</tr></thead>
          <tbody>${items.map((i) => `<tr>
            <td><b>${esc(i.name)}</b><br><span class="small muted">${esc(i.category)}</span></td>
            ${outlets.map((o) => cell(i, o.id, i.outlets[o.id])).join('')}
            ${outlets.length > 1 ? `<td class="stock-all"><button type="button" class="chip" data-stock-all="on" data-item="${i.id}">All on</button> <button type="button" class="chip" data-stock-all="off" data-item="${i.id}">All off</button> <button type="button" class="chip" data-stock-all="nolimit" data-item="${i.id}">No limits</button></td>` : ''}
          </tr>`).join('') || `<tr><td colspan="${outlets.length + 2}" class="muted">No dishes match.</td></tr>`}</tbody>
        </table></div>
      </section>`;
  }

  async function saveStock(body, done) {
    try {
      await window.RCAdmin.api('/stock', { method: 'POST', body });
      S.msg = done;
    } catch (err) { S.msg = err.message; }
    window.RCAdmin.refresh();
  }

  // ---- Outlets ----------------------------------------------------------------

  // Add-outlet form, also used to edit one (S.editing = outlet id).
  // Cities the business already has outlets in.
  let knownCities = [];
  const cities = () => knownCities;
  function outletForm(o) {
    const v = (k) => esc(o?.[k] ?? '');
    const f = (name, label, input, hint = '') => `<label class="ofield"><span>${label}</span>${input}${hint ? `<small class="muted">${hint}</small>` : ''}</label>`;
    return `<form id="outletForm" class="outlet-form" data-id="${o ? o.id : ''}">
      ${f('name', 'Outlet name', `<input name="name" required value="${o ? esc(short(o.name)) : ''}" placeholder="e.g. Sector 22">`, BRAND.outletPrefix ? `Shown to customers as "${esc(BRAND.outletPrefix)}…"` : '')}
      ${f('city', 'City', `<input name="city" required list="cityList" value="${v('city')}" placeholder="${esc(cities()[0] || 'City')}">`)}
      ${f('address', 'Full address', `<input name="address" required value="${v('address')}" placeholder="SCO / booth no., market, sector, PIN code">`)}
      ${f('phone', 'Outlet phone', `<input name="phone" required inputmode="tel" value="${v('phone')}" placeholder="98765 43210">`)}
      ${f('mapsLink', 'Location', `<input name="mapsLink" placeholder="Paste the Google Maps link of the outlet">`, `Or type the coordinates:${o ? ` now ${o.lat}, ${o.lng}` : ''}`)}
      <div class="row"><input name="lat" type="number" step="any" placeholder="Latitude" value="${v('lat')}" aria-label="Latitude"><input name="lng" type="number" step="any" placeholder="Longitude" value="${v('lng')}" aria-label="Longitude"></div>
      <div class="row">${f('opens', 'Opens', `<input name="opens" type="time" required value="${o ? v('opens') : '11:00'}">`)}${f('closes', 'Closes', `<input name="closes" type="time" required value="${o ? v('closes') : '23:00'}">`, 'Same time = open 24 hours')}</div>
      ${f('upiId', 'UPI ID for online payments', `<input name="upiId" value="${v('upi_id')}" placeholder="${esc(BRAND.upiExample)}">`, 'Optional. Without it, customers pay cash/UPI on delivery.')}
      ${f('sfxStoreCode', 'Shadowfax store code', `<input name="sfxStoreCode" value="${v('sfx_store_code')}">`, 'Optional, from Shadowfax onboarding.')}
      ${f('waPaymentConfig', 'WhatsApp payment configuration', `<input name="waPaymentConfig" value="${v('wa_payment_config')}">`, 'Optional, from WhatsApp Manager → Payments.')}
      ${o ? '' : f('pin', 'Outlet panel PIN', '<input name="pin" type="password" inputmode="numeric" pattern="\\d{4,8}" placeholder="4–8 digits">', 'Optional now; you can set it later.')}
      <datalist id="cityList">${cities().map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
      <p class="error hidden" role="alert"></p>
      <div class="row"><button class="btn" style="width:auto">${o ? 'Save changes' : 'Add outlet'}</button><button type="button" class="btn secondary" style="width:auto" data-outlet-form="close">Cancel</button></div>
    </form>`;
  }

  async function renderOutlets(ctx) {
    if (document.activeElement?.closest?.('#view .outlet-table input, #view .outlet-form')) return;
    const [outlets, logins] = await Promise.all([ctx.api('/outlets'), ctx.api('/logins')]);
    ctx.state.outlets = outlets;
    knownCities = [...new Set(outlets.map((o) => o.city))];
    // Keep the top bar's outlet filter in step with new outlets.
    const sel = $('outlet');
    if (sel && sel.options.length !== outlets.length + 1) {
      sel.innerHTML = '<option value="">All outlets</option>' + outlets.map((o) => `<option value="${o.id}">${esc(o.name)}</option>`).join('');
      sel.value = ctx.state.outletId;
    }
    const login = new Map(logins.map((l) => [l.outletId, l]));
    const editing = S.editing === 'new' ? null : outlets.find((o) => o.id === S.editing);
    $('view').innerHTML = `
      <section class="card">
        <header><h3>${S.editing ? (editing ? `Edit ${esc(short(editing.name))}` : 'Add a new outlet') : `${outlets.length} outlets`}</h3>
          ${S.editing ? '' : '<button type="button" class="btn" style="width:auto" data-outlet-form="new">+ Add outlet</button>'}</header>
        ${S.editing ? outletForm(editing) : '<p class="small muted">A new outlet takes orders straight away: customers nearest to it are routed there, the whole menu is in stock until you change it on the Stock tab, and its tablet can log in once it has a PIN.</p>'}
      </section>
      <section class="card">
        <header><h3>Outlets and outlet panel logins</h3>
          <span class="muted small">Each outlet's tablet opens <b>/outlet/</b> and logs in with the PIN you set here. It then sees only that outlet's orders, chats and (read-only) stock. Changing a PIN signs that outlet's tablets out.</span></header>
        ${S.msg ? `<p class="small" role="status">${esc(S.msg)}</p>` : ''}
        <div class="table-wrap"><table class="data outlet-table">
          <thead><tr><th>Outlet</th><th>Taking orders</th><th>Panel login</th><th>Tablets signed in</th><th>Set new PIN</th><th><span class="sr-only">Edit</span></th></tr></thead>
          <tbody>${outlets.map((o) => {
            const l = login.get(o.id) || {};
            return `<tr>
              <td><b>${esc(short(o.name))}</b><br><span class="small muted">${esc(o.address)} · ${esc(o.phone)} · ${o.opens === o.closes ? 'open 24 hours' : `${esc(o.opens)}–${esc(o.closes)}`}</span></td>
              <td><label><input type="checkbox" data-accept="${o.id}" ${o.accepting_orders ? 'checked' : ''} style="width:auto" aria-label="${esc(short(o.name))} taking orders"> ${o.accepting_orders ? 'Yes' : 'Paused'}</label></td>
              <td>${l.hasPin ? `PIN set ${esc(when(l.pinSetAt))}` : '<span class="chip">No PIN yet</span>'}</td>
              <td>${l.devices || 0}${l.lastLoginAt ? `<br><span class="small muted">last ${esc(when(l.lastLoginAt))}</span>` : ''}${l.devices ? `<br><button type="button" class="link" data-signout="${o.id}">Sign out all</button>` : ''}</td>
              <td><form class="row" data-pin="${o.id}"><input name="pin" type="password" inputmode="numeric" pattern="\\d{4,8}" placeholder="4–8 digits" required aria-label="New PIN for ${esc(short(o.name))}" style="max-width:120px"><button class="btn" style="width:auto">Save</button></form></td>
              <td><button type="button" class="link" data-outlet-form="${o.id}">Edit</button></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </section>`;
  }

  // ---- Events -------------------------------------------------------------------

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.stockOn) {
      saveStock({ outletId: Number(t.dataset.stockOn), itemId: Number(t.dataset.item), available: t.checked }, 'Saved.');
    } else if (t.dataset.stockCount) {
      saveStock({ outletId: Number(t.dataset.stockCount), itemId: Number(t.dataset.item), remaining: t.value === '' ? null : Number(t.value) }, 'Saved.');
    } else if (t.id === 'sCat') {
      S.category = t.value; window.RCAdmin.refresh();
    } else if (t.dataset.accept) {
      window.RCAdmin.api(`/outlets/${t.dataset.accept}`, { method: 'PATCH', body: { acceptingOrders: t.checked } })
        .then(() => { S.msg = ''; window.RCAdmin.refresh(); }, (err) => alert(err.message));
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id !== 'sQ') return;
    S.q = e.target.value;
    clearTimeout(S.timer);
    S.timer = setTimeout(() => { e.target.blur(); window.RCAdmin.refresh().then(() => { const q = $('sQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }); }, 300);
  });

  document.addEventListener('keydown', (e) => {
    // Enter in a count saves it (via change) and moves on.
    if (e.key === 'Enter' && e.target.dataset?.stockCount) e.target.blur();
  });

  document.addEventListener('click', (e) => {
    const show = e.target.closest('[data-stock-show]');
    if (show) { S.show = show.dataset.stockShow; window.RCAdmin.refresh(); return; }
    const all = e.target.closest('[data-stock-all]');
    if (all) {
      const body = { outletId: 'all', itemId: Number(all.dataset.item) };
      if (all.dataset.stockAll === 'nolimit') body.remaining = null; else body.available = all.dataset.stockAll === 'on';
      saveStock(body, 'Saved for every outlet.');
      return;
    }
    const of = e.target.closest('[data-outlet-form]');
    if (of) {
      const v = of.dataset.outletForm;
      S.editing = v === 'close' ? null : v === 'new' ? 'new' : Number(v);
      document.activeElement?.blur();
      window.RCAdmin.refresh().then(() => { $('outletForm')?.elements.name.focus(); window.scrollTo({ top: 0 }); });
      return;
    }
    const so = e.target.closest('[data-signout]');
    if (so && confirm('Sign out every tablet of this outlet? They will need the PIN again.')) {
      window.RCAdmin.api(`/outlets/${so.dataset.signout}/sign-out`, { method: 'POST' })
        .then(() => { S.msg = 'Tablets signed out.'; window.RCAdmin.refresh(); }, (err) => alert(err.message));
    }
  });

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('#outletForm');
    if (form) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const body = { name: data.name, city: data.city, address: data.address, phone: data.phone, opens: data.opens, closes: data.closes,
        upiId: data.upiId, sfxStoreCode: data.sfxStoreCode, waPaymentConfig: data.waPaymentConfig };
      if (data.mapsLink.trim()) body.mapsLink = data.mapsLink.trim(); else { body.lat = data.lat; body.lng = data.lng; }
      const id = form.dataset.id;
      try {
        const res = await window.RCAdmin.api(id ? `/outlets/${id}` : '/outlets', { method: id ? 'PATCH' : 'POST', body });
        const outlet = res.outlet || res;
        const near = res.nearest ? ` Nearest other outlet: ${short(res.nearest.name)}, ${res.nearest.km} km away${res.nearest.km < 0.5 ? ' (check the location is right)' : ''}.` : '';
        if (!id && data.pin) await window.RCAdmin.api(`/outlets/${outlet.id}/pin`, { method: 'POST', body: { pin: data.pin } });
        S.msg = id ? `Saved ${short(outlet.name)}.${near}` : `${short(outlet.name)} added and taking orders.${near}${data.pin ? ' PIN set.' : ' Set its PIN below so its tablet can log in.'}`;
        S.editing = null;
        document.activeElement?.blur();
      } catch (err) {
        // Keep what was typed; just show the problem.
        const p = form.querySelector('.error');
        p.textContent = err.message;
        p.classList.remove('hidden');
        return;
      }
      window.RCAdmin.refresh();
      return;
    }
    const f = e.target.closest('[data-pin]');
    if (!f) return;
    e.preventDefault();
    try {
      await window.RCAdmin.api(`/outlets/${f.dataset.pin}/pin`, { method: 'POST', body: { pin: f.elements.pin.value } });
      S.msg = 'PIN saved. Give it to the outlet manager; their tablets need to log in again.';
    } catch (err) { S.msg = err.message; }
    f.elements.pin.value = '';
    window.RCAdmin.refresh();
  });

  const reset = (fn) => (ctx) => { if (window.RCAdmin.state.lastView !== window.RCAdmin.state.view) { S.msg = ''; S.editing = null; } window.RCAdmin.state.lastView = window.RCAdmin.state.view; return fn(ctx); };
  Object.assign(window.RCInsights, {
    stock: () => reset(renderStock)(window.RCAdmin),
    outlets: () => reset(renderOutlets)(window.RCAdmin),
  });
})();
</script>
  <script>'use strict';

// Head office → Connections: payment gateways, UPI, WhatsApp and delivery
// partners. Keys entered here override the server's .env, are stored
// encrypted, apply at once, and are never shown again (only "set, ends …1a2b").
// Loaded after staff/panel.js and insights.js; registers its view on RCInsights.

(() => {
  const $ = (id) => document.getElementById(id);
  const S = { data: null, msg: {}, busy: '', dirty: new Set() };
  const when = (iso) => (iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '');
  const STATE = { on: ['ok', 'Connected'], test: ['test', 'Test mode'], warn: ['warn', 'Needs attention'], off: ['off', 'Off'] };

  function field(id, f) {
    const name = `f:${f.path}`;
    const src = f.source === 'panel' ? `<span class="src">set here${f.updatedAt ? ` · ${esc(when(f.updatedAt))}` : ''}</span>`
      : f.source === 'server' ? '<span class="src">from server settings (.env)</span>' : '';
    const clear = f.source === 'panel' ? `<button type="button" class="link" data-conn-clear="${id}" data-path="${esc(f.path)}" title="Remove the value saved here and use the server setting">use server setting</button>` : '';
    let input;
    if (f.type === 'select') {
      input = `<select name="${name}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    } else if (f.type === 'secret') {
      input = `<input name="${name}" type="password" autocomplete="new-password" spellcheck="false" placeholder="${f.hint ? `${esc(f.hint)} · type to replace` : 'not set'}">`;
    } else {
      input = `<input name="${name}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" spellcheck="false">`;
    }
    return `<label class="ofield"><span>${esc(f.label)} ${src} ${clear}</span>${input}${f.help ? `<small class="muted">${esc(f.help)}</small>` : ''}</label>`;
  }

  function card(c) {
    const [cls, word] = STATE[c.status.state] || STATE.off;
    const msg = S.msg[c.id];
    return `<section class="card conn" data-conn="${c.id}">
      <header><h3>${esc(c.title)}</h3><span class="chip conn-${cls}" title="${esc(word)}">${esc(c.status.text || word)}</span></header>
      <p class="small muted" style="margin-top:0">${esc(c.about)}</p>
      ${c.webhook ? `<div class="small webhook">Notifications address (paste into the ${esc(c.title.split(' ')[0])} dashboard):
        <code>${esc(c.webhook)}</code> <button type="button" class="link" data-copy="${esc(c.webhook)}">copy</button></div>` : ''}
      <form data-conn-form="${c.id}" autocomplete="off">
        <div class="conn-fields">${c.fields.map((f) => field(c.id, f)).join('')}</div>
        <div class="row" style="gap:8px;margin-top:8px">
          <button class="btn" style="width:auto" ${S.busy === c.id ? 'disabled' : ''}>Save</button>
          ${c.testable ? `<button type="button" class="btn secondary" style="width:auto" data-conn-test="${c.id}" ${S.busy === c.id ? 'disabled' : ''}>Test connection</button>` : ''}
        </div>
      </form>
      ${msg ? `<p class="small conn-msg ${msg.ok === false ? 'bad' : msg.ok ? 'good' : ''}" role="status">${esc(msg.text)}</p>` : ''}
    </section>`;
  }

  async function renderConnections(ctx) {
    // Don't wipe what someone is typing.
    if (S.dirty.size || document.activeElement?.closest?.('#view .conn form')) return;
    S.data = await ctx.api('/connections');
    const groups = [...new Set(S.data.integrations.map((c) => c.group))];
    $('view').innerHTML = `
      <section class="card">
        <header><h3>Connections</h3><span class="small muted">Keys saved here are encrypted (${esc(S.data.encryption)}), apply immediately and are never shown again.</span></header>
        ${S.data.unreadable.length ? `<p class="small bad">Some saved keys can't be read (was SETTINGS_KEY changed?): ${S.data.unreadable.map(esc).join(', ')}. Enter them again.</p>` : ''}
        <p class="small muted" style="margin:0">Empty fields use the server's settings file. Fill one in to override it; "use server setting" removes the override.</p>
      </section>
      ${groups.map((g) => `<h3 class="section">${esc(g)}</h3><div class="conn-grid">${S.data.integrations.filter((c) => c.group === g).map(card).join('')}</div>`).join('')}
      <section class="card">
        <header><h3>Recent changes</h3></header>
        ${S.data.log.length ? `<ul class="small conn-log">${S.data.log.map((l) => `<li><b>${esc(when(l.at))}</b> · ${esc(l.integration)}: ${esc(l.change)}${l.by ? ` <span class="muted">(${esc(l.by)})</span>` : ''}</li>`).join('')}</ul>` : '<p class="small muted">No changes made here yet.</p>'}
      </section>`;
  }

  const refresh = () => { S.dirty.clear(); document.activeElement?.blur(); return window.RCAdmin.refresh(); };

  document.addEventListener('input', (e) => {
    const f = e.target.closest?.('[data-conn-form]');
    if (f) S.dirty.add(f.dataset.connForm);
  });

  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-conn-form]');
    if (!form) return;
    e.preventDefault();
    const id = form.dataset.connForm;
    const c = S.data.integrations.find((x) => x.id === id);
    const values = {};
    for (const f of c.fields) {
      const v = form.elements[`f:${f.path}`].value.trim();
      if (f.type === 'secret') { if (v) values[f.path] = v; continue; } // empty = keep
      if (v !== (f.value || '')) values[f.path] = v;
    }
    if (!Object.keys(values).length) { S.msg[id] = { text: 'Nothing changed.' }; return refresh(); }
    S.busy = id;
    try {
      await window.RCAdmin.api(`/connections/${id}`, { method: 'PUT', body: { values } });
      S.msg[id] = { ok: true, text: c.testable ? 'Saved and in use. Use "Test connection" to check the keys.' : 'Saved and in use.' };
    } catch (err) { S.msg[id] = { ok: false, text: err.message }; }
    S.busy = '';
    refresh();
  });

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-conn-test]');
    if (t) {
      const id = t.dataset.connTest;
      if (S.dirty.has(id)) { S.msg[id] = { ok: false, text: 'Save first, then test.' }; return refresh(); }
      S.busy = id; S.msg[id] = { text: 'Testing…' }; refresh();
      try {
        const r = await window.RCAdmin.api(`/connections/${id}/test`, { method: 'POST' });
        S.msg[id] = { ok: r.ok, text: r.message };
      } catch (err) { S.msg[id] = { ok: false, text: err.message }; }
      S.busy = '';
      return refresh();
    }
    const clr = e.target.closest('[data-conn-clear]');
    if (clr) {
      const id = clr.dataset.connClear;
      if (!confirm('Remove the value saved here and use the server setting instead?')) return;
      try {
        await window.RCAdmin.api(`/connections/${id}`, { method: 'PUT', body: { values: { [clr.dataset.path]: '' } } });
        S.msg[id] = { ok: true, text: 'Now using the server setting.' };
      } catch (err) { S.msg[id] = { ok: false, text: err.message }; }
      return refresh();
    }
    const cp = e.target.closest('[data-copy]');
    if (cp) {
      try { await navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = 'copied'; } catch { prompt('Copy this address:', cp.dataset.copy); }
    }
  });

  Object.assign(window.RCInsights, {
    connections: () => renderConnections(window.RCAdmin),
  });
})();
</script>
</body>
</html>
